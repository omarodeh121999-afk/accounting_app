name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          unzip -q accounting_flutter_project.zip
          cd accounting_flutter
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: Get dependencies
        working-directory: accounting_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: accounting_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: accounting_flutter/build/app/outputs/flutter-apk/app-release.apk
